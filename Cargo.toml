[package]
name = "agent-inbox"
version = "0.1.0"
edition = "2024"
publish = false
description = "Durable, boundary-aware notifications for Codex sessions"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
